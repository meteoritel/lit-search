[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litsearch"
dynamic = ["version"]
description = "多源文献检索 CLI（OpenAlex、Crossref、Europe PMC），零第三方运行时依赖"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["openalex", "crossref", "europepmc", "literature", "cli", "bibliography"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
]

[project.scripts]
litsearch = "litsearch:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["litsearch"]
packages = []

[tool.setuptools.dynamic]
version = { attr = "litsearch.__version__" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/litsearch.py"]
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
