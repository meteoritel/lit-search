[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litsearch"
version = "0.2.0"
description = "多源文献检索 CLI（OpenAlex + Crossref），零第三方运行时依赖"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["openalex", "crossref", "literature", "cli", "bibliography"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
]

[project.scripts]
litsearch = "litsearch:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["litsearch"]
packages = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
