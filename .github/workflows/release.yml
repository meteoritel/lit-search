name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py check-tag "$RELEASE_TAG"

  check:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify-tag, check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --group release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist
      - run: uv run --locked --extra dev --group release python scripts/release.py build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "litsearch $RELEASE_TAG" --draft
          gh release edit "$RELEASE_TAG" --draft=false
